# Image tag is provided by ~/projects/aerodesk-runtime/.env (APP_IMAGE).
# Must use same Compose project name as the baseline app: aerodesk-ai-demo.
services:
  demo:
    image: ${APP_IMAGE:?APP_IMAGE must be defined}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 256m
    pids_limit: 100
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
