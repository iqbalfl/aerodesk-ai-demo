name: Build and Deploy Demo
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: aerodesk-production
  cancel-in-progress: false
jobs:
  build:
    name: Test and Publish Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix app --no-audit --no-fund
      - name: Regression test
        run: npm test --prefix app
      - name: Select immutable image tag
        id: name
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
      - name: Build container
        run: docker build --build-arg APP_REVISION="$GITHUB_SHA" -t "${{ steps.name.outputs.image }}" .
      - name: Login to GitHub Container Registry
        run: echo "$GHCR_PASSWORD" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: docker push "${{ steps.name.outputs.image }}"
  deploy:
    name: Deploy VPS over SSH
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      contents: read
    steps:
      - name: Configure SSH with pinned known host
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy pinned image and verify health
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          APP_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "/opt/aerodesk/remote-deploy.sh '$APP_IMAGE' '$GITHUB_SHA'"
