name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aerodesk-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install app dependencies
        run: npm install --prefix app --no-audit --no-fund
      - name: Regression tests
        run: npm test --prefix app
      - name: Build Docker image without deploying
        run: docker build --build-arg "APP_REVISION=${GITHUB_SHA}" -t aerodesk-pr-test .
