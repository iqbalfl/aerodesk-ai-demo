name: PR Validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --prefix app --no-audit --no-fund
      - name: Pagination regression tests
        run: npm test --prefix app
      - name: Build container (no deployment)
        run: docker build --build-arg APP_REVISION="${{ github.sha }}" -t aerodesk-pr-test .
